<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the service's own user may own the name. -->
  <policy user="wg-dbusd">
    <allow own="io.github.thokis.WireGuard1"/>
  </policy>

  <!-- Any local client may read (call / receive signals from) the service.
       Restrict to a group with <policy group="..."> if you want fewer readers. -->
  <policy context="default">
    <allow send_destination="io.github.thokis.WireGuard1"/>
    <allow receive_sender="io.github.thokis.WireGuard1"/>
  </policy>
</busconfig>
